services:
  mongo:
    image: mongo:7.0
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    ports:
      - "27018:27018"
    tmpfs:
      - /data/db
    healthcheck:
      test: >
        mongosh --port 27018 --quiet --eval "try { rs.status().ok } catch (e) {
        rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27018'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s
